[package]
name = "trove"
version = "0.1.0"
description = "Trove — vendor-neutral configurator and OTLP gateway for AI coding harnesses"
authors = ["Intevity"]
license = "MIT"
repository = "https://github.com/Intevity/trove"
edition = "2021"
rust-version = "1.77"

[lib]
name = "trove_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
# Sprint 8 — `MergeManually` resolution opens the host config in the OS
# default editor (via `open`/`xdg-open`/`start`). The shell plugin's
# `open()` API abstracts the per-platform call. We deliberately do not
# grant `shell:allow-execute` — only `shell:allow-open` scoped to the
# user's home directory in `capabilities/default.json`.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "fs",
    "time",
    "signal",
    "sync",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
# Sprint 2: filesystem safety toolkit. tempfile underpins atomic writes
# (NamedTempFile::persist); sha2 hashes managed regions for conflict
# detection; chrono produces RFC3339-with-microseconds backup suffixes.
tempfile = "3"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Sprint 2 PR 2: managed-region engine for the four config formats
# adapters touch. serde_json with preserve_order keeps key order stable
# across re-applies; jsonc-parser's CST feature preserves comments
# through AST mutation; toml_edit preserves both comments and the
# relative ordering of items; serde_yml is the maintained fork of
# serde_yaml (parse-validate only — YAML uses comment-fenced text edits).
serde_json = { version = "1", features = ["preserve_order"] }
jsonc-parser = { version = "0.26", features = ["cst", "serde"] }
toml_edit = "0.22"
serde_yml = "0.0.12"
hex = "0.4"
# Sprint 3: harness detection. `which` resolves PATH binaries
# cross-platform; `dirs` resolves the user's home directory uniformly
# (Windows %USERPROFILE%, macOS/Linux $HOME).
which = "6"
dirs = "5"
# Sprint 5 PR 1: backend secrets + app state persistence.
# `keyring` is the unified wrapper over macOS Keychain / Linux Secret
# Service / Windows Credential Manager — Trove never writes raw secrets
# to disk. v3 requires explicit feature flags to opt into a platform
# backend; `apple-native` covers macOS, `windows-native` covers Windows,
# `sync-secret-service` covers Linux via D-Bus + libsecret. Without
# these the crate compiles but every operation returns `NoEntry`.
# `zeroize` wraps in-memory secret strings so the heap buffer is wiped
# on drop (codegen reads from keychain, hands env vars to the child
# process, then drops; without Zeroizing the value lingers).
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
zeroize = { version = "1", features = ["zeroize_derive"] }
# Sprint 6 PR 2: tray icon retinting. The bundled tray-icon.png is
# decoded once per TintColor (cached in OnceLock), then RGB is
# replaced per pixel preserving alpha. `default-features = false`
# strips the unrelated codec set; we only need PNG.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
proptest = "1"
assert_fs = "1"
pretty_assertions = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we deliberately allow project-wide. Re-evaluate as the
# codebase grows.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
