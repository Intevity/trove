[package]
name = "trove"
version = "0.1.0"
description = "Trove — vendor-neutral configurator and OTLP gateway for AI coding harnesses"
authors = ["Intevity"]
license = "MIT"
repository = "https://github.com/Intevity/trove"
edition = "2021"
rust-version = "1.77"

[lib]
name = "trove_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we deliberately allow project-wide. Re-evaluate as the
# codebase grows.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
