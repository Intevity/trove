# trove-otelcol — SigNoz preset (cloud + self-hosted OSS).
#
# Uses OTLP/gRPC. The endpoint is supplied verbatim by the user:
#   - Cloud:       `ingest.us.signoz.cloud:443`  (TLS on)
#   - Self-hosted: `localhost:14317`             (TLS off)
#
# Trove auto-detects loopback endpoints (localhost / 127.0.0.1 / ::1 /
# 0.0.0.0) and renders `tls.insecure: true` for those. See
# `packages/app/src-tauri/src/collector/codegen.rs::endpoint_is_loopback`.
#
# ${env:...} variables are populated by the Rust supervisor at spawn
# time from the keychain (TROVE_SIGNOZ_INGESTION_KEY) and the persisted
# Backend struct (TROVE_SIGNOZ_ENDPOINT). Trove never rewrites this
# file with secrets inline.

extensions:
  health_check:
    endpoint: 127.0.0.1:13133
    path: /health

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 5s
  attributes/redact:
    actions:
      - { key: user.prompt, action: delete }
      - { key: prompt.text, action: delete }
  resource/source:
    attributes:
      - { key: trove.source, value: signoz, action: insert }

exporters:
  otlp/signoz:
    endpoint: ${env:TROVE_SIGNOZ_ENDPOINT}
    tls:
      # Codegen substitutes `true` here for loopback endpoints.
      insecure: false
    headers:
      signoz-ingestion-key: ${env:TROVE_SIGNOZ_INGESTION_KEY}

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch, attributes/redact, resource/source]
      exporters: [otlp/signoz]
    logs:
      receivers: [otlp]
      processors: [batch, attributes/redact, resource/source]
      exporters: [otlp/signoz]
    traces:
      receivers: [otlp]
      processors: [batch, attributes/redact, resource/source]
      exporters: [otlp/signoz]
  telemetry:
    logs:
      level: info
      encoding: console
    # Sprint 6: Prometheus endpoint for trove's metrics_tap (loopback only).
    # Use the `readers` schema; collector v0.151+ rejects the legacy
    # `address` scalar via its migration helper.
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: '127.0.0.1'
                port: 8888
