name: Notarize poll (scheduled finalize)

# The long-tail companion to release.yml's short inline notarize-wait. When Apple's notary
# queue is slow (this team's submissions sometimes sit "In Progress" for hours), the release
# run defers instead of holding a runner — it leaves the draft release tagged with
# notary-*.json marker assets. This workflow wakes on a cron, finds such a draft, checks the
# submissions with a single REST pass (no held runner), and finalizes (staple + publish) the
# moment Apple has Accepted them. Cost scales with the number of ~15s checks, not the wait
# duration, so a 4-hour Apple delay costs a few minutes of 1x ubuntu total.
on:
  schedule:
    # Every ~30 min, off the :00/:30 marks. Idle ticks (nothing pending) exit in seconds.
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write # the reusable finalize workflow's S3 publish assumes the AWS role via OIDC
  actions: write # this workflow disables its own schedule once nothing is pending (see discover)

jobs:
  discover:
    name: Find a draft release awaiting notarization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.scan.outputs.tag }}
      ready: ${{ steps.scan.outputs.ready }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scan for a pending release and poll it once
        id: scan
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"

          # Backstop: a draft that has carried notary markers for this long has not
          # finalized for reasons the poll can't fix on its own (Apple stuck, or a
          # finalize that keeps failing). Stop looping rather than burn minutes forever.
          # The inline notarize-wait already covers 90 min and Apple's slow tail is
          # hours, so 24h is safely past any legitimate delay.
          MAX_PENDING_HOURS=24

          # Remove a draft's pending-notarization markers so this scheduled poll stops
          # treating it as pending (the draft + its artifacts stay for inspection).
          clear_markers() {
            local t="$1"
            for a in $(gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets \
                        --jq '.assets[].name | select(startswith("notary-") and endswith(".json"))'); do
              gh release delete-asset "$t" "$a" --yes --repo "$GITHUB_REPOSITORY" || true
            done
          }

          # A release "awaiting notarization" is a DRAFT carrying notary-*.json marker
          # assets (written by the build leg). Find the first such draft.
          tag=""
          while read -r t; do
            [ -z "$t" ] && continue
            has=$(gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets \
                    --jq '[.assets[].name | select(startswith("notary-") and endswith(".json"))] | length' 2>/dev/null || echo 0)
            if [ "${has:-0}" -gt 0 ]; then tag="$t"; break; fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName,isDraft \
                     --jq '.[] | select(.isDraft) | .tagName')

          if [ -z "$tag" ]; then
            # Nothing pending -> go dormant. release.yml's notarize-wait re-enables this
            # schedule (gh workflow enable) the moment a release defers, so the poll only
            # exists while Apple is genuinely mid-notarization — no perpetual idle ticks.
            # Disable ONLY here (not after clear_markers / finalize): those resolve on a
            # later tick that re-scans, finds nothing, and lands in this branch — which also
            # keeps the rare two-drafts-pending case correct (stay enabled until ALL clear).
            echo "No draft releases awaiting notarization — disabling the scheduled poll until a release defers."
            gh workflow disable notarize-poll.yml --repo "$GITHUB_REPOSITORY" || true
            exit 0
          fi
          echo "Pending release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          mkdir -p notary-ids
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --dir notary-ids --pattern 'notary-*.json'

          set +e
          node scripts/notary-poll.mjs --once notary-ids
          code=$?
          set -e
          case "$code" in
            0) # Apple Accepted every submission. Before finalizing, confirm the draft
               # actually carries a COMPLETE updater artifact set — otherwise finalize
               # (and its 10x macOS staple job) would run on every tick only to die in
               # assemble-latest-json, looping forever. This name-only check downloads
               # nothing and reuses assemble-latest-json's own REQUIRED_KEYS.
               names="$(mktemp)"
               gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                 --jq '.assets[].name' > "$names"
               set +e
               node scripts/assemble-latest-json.mjs --check-names "$names"
               complete=$?
               set -e
               if [ "$complete" -eq 0 ]; then
                 echo "ready=true" >> "$GITHUB_OUTPUT"
                 echo "All submissions Accepted and the artifact set is complete -> finalizing $tag."
               else
                 echo "::error::$tag is Accepted by Apple but is missing required updater artifacts (see above) — it can never finalize (likely a timed-out / partial build). Clearing its notary markers to stop the scheduled poll from looping; the draft stays for inspection. Investigate and re-release."
                 clear_markers "$tag"
                 exit 1
               fi ;;
            2) # Still in Apple's queue. Keep deferring to the next tick UNLESS the draft
               # has been pending past the backstop, in which case stop looping.
               created="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json createdAt --jq '.createdAt')"
               age_h=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 3600 ))
               if [ "$age_h" -ge "$MAX_PENDING_HOURS" ]; then
                 echo "::error::$tag has been awaiting notarization for ${age_h}h (>= ${MAX_PENDING_HOURS}h) — treating as stuck. Clearing its notary markers to stop the poll loop; the draft stays for inspection. Check the Apple submission and re-release if needed."
                 clear_markers "$tag"
                 exit 1
               fi
               echo "Still pending (${age_h}h old) -> will recheck on the next scheduled tick." ;;
            *) # Invalid/Rejected: remove the markers so we stop looping, and fail loudly once.
               echo "::error::Notarization Invalid for $tag. Removing pending markers (the draft remains for inspection); investigate and re-release."
               clear_markers "$tag"
               exit 1 ;;
          esac

  finalize:
    name: Finalize accepted release
    needs: [discover]
    if: needs.discover.outputs.ready == 'true'
    uses: ./.github/workflows/notarize-finalize.yml
    with:
      tag: ${{ needs.discover.outputs.tag }}
    secrets: inherit
