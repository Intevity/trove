name: Nightly

# Sprint 11 PR 3 — upstream-harness drift detector. Runs daily and files
# a GitHub issue when claude-code / cursor / codex / gemini / etc. ship a
# new release we haven't bumped against. The maintainer triages the
# `adapter-regression` label.
#
# Earlier revisions of this workflow also ran a `cargo-llvm-cov` coverage
# gate (golden-tests job). Dropped in May 2026 to cut GitHub Actions
# spend — the instrumented build re-linked the whole workspace and cost
# ~30 min/day for a gate that flipped infrequently. PR CI still runs
# `cargo test` on every change, so functional regressions are caught
# within the hour. See git history for the prior job if you need to
# reintroduce a coverage floor.

on:
  schedule:
    # 06:17 UTC daily. Off the :00 hour so we don't pile onto GitHub's
    # rate-limit cliff alongside every other repo's hourly cron.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  harness-version-drift:
    name: Upstream harness version drift
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      drifted: ${{ steps.run.outputs.drifted }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run drift detector
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm exec jiti scripts/check-harness-versions.ts > drift-report.md
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi
          cat drift-report.md
          # Exit clean — the issue-opener job below uses the `drifted`
          # output to decide whether to file. Failing here would cancel
          # the issue-opener via `needs:` ordering.
          exit 0

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: harness-drift-report-${{ github.run_id }}
          path: drift-report.md
          retention-days: 30
          if-no-files-found: ignore

  notify-on-regression:
    name: Open adapter-regression issue
    needs: [harness-version-drift]
    if: |
      github.event_name == 'schedule' &&
      needs.harness-version-drift.outputs.drifted == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download drift report
        uses: actions/download-artifact@v4
        with:
          name: harness-drift-report-${{ github.run_id }}
          path: .
        continue-on-error: true

      - name: File adapter-regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRIFTED: ${{ needs.harness-version-drift.outputs.drifted }}
        run: |
          set -euo pipefail
          {
            echo "# Upstream harness drift detected"
            echo
            echo "Triggered by [nightly run]($RUN_URL)."
            echo
            echo "- harness-version-drift: \`$DRIFTED\`"
            echo
            if [ -f drift-report.md ]; then
              echo "## Drift report"
              echo
              cat drift-report.md
            fi
          } > body.md
          gh issue create \
            --title "Nightly adapter regression on $(date -u +%Y-%m-%d)" \
            --label adapter-regression \
            --body-file body.md
