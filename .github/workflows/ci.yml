name: CI

on:
  pull_request:
    # Skip the full Rust + macOS pipeline for changes that can't affect
    # build output: prose-only doc edits, repo-root markdown, license,
    # and contributor governance files. Any code change still falls
    # through and runs the full lane.
    paths-ignore:
      - 'documentation/**'
      - '**/*.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cost guard: classify which trees a PR touches so the macOS-only
  # `sidecar-mac` job (10x runner-minute multiplier) runs only when the
  # supervisor / collector / sidecar pipeline can actually be affected.
  # Skipped entirely on draft PRs and on `push: main` (the latter has no
  # diff base, and sidecar-mac is PR-only anyway).
  changes:
    name: detect affected paths
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    # dorny/paths-filter@v3 calls the GitHub listFiles API and also
    # does git fetches as a fallback; the default GITHUB_TOKEN scope set
    # is fully replaced by a job-level permissions block, so we have to
    # grant both contents:read (for git operations / actions/checkout)
    # and pull-requests:read (for the listFiles API).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sidecar: ${{ steps.filter.outputs.sidecar }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sidecar:
              - 'packages/app/src-tauri/**'
              - 'resources/otelcol/**'
              - 'scripts/build-collector.sh'
              - 'scripts/bundle-sidecar.ts'
              - 'packages/collector-presets/**'
              - '.github/workflows/ci.yml'

  ci:
    name: lint / typecheck / test (ubuntu)
    # Drafts: skip CI entirely. Re-trigger via `gh pr ready <n>` (or the
    # "Ready for review" button). `push: main` always runs.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      # Free ~25–30 GB by removing pre-installed software the Tauri
      # build doesn't need (Android SDK, .NET, Haskell, large APT
      # packages, pre-pulled Docker images). Sprint 8 PR 1 added
      # `tauri-plugin-shell`, which pulled in additional WebKit/GTK
      # transitive deps; the `cargo-llvm-cov` instrumented build that
      # follows roughly doubles the per-test link footprint and was
      # tipping the runner's default ~14 GB free space below the cliff,
      # surfacing as `cc: ld terminated with signal 7 [Bus error]`.
      # Removing the unused toolchains restores headroom.
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Install Linux Tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
          shared-key: trove-rust-${{ runner.os }}
          # Only save the cache from main. The post-job save step
          # invokes `cargo metadata --all-features`, which resolves
          # Windows-target crates (e.g. windows_aarch64_gnullvm) and
          # has been failing intermittently on the hosted Linux
          # runner — usually with "No space left on device" — on PRs
          # that change Cargo.lock. Skipping save on PRs keeps the
          # restore behaviour (so PRs still get fast builds) without
          # the flaky save path.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Go is needed by `pnpm build:collector` (ocb is invoked via
      # `go install go.opentelemetry.io/collector/cmd/builder@<pin>`).
      # ocb v0.151.0 requires Go 1.25+.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache ocb module cache + installed binary
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: trove-ocb-${{ runner.os }}-${{ hashFiles('resources/otelcol/manifest.yaml') }}
          restore-keys: |
            trove-ocb-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TS workspace libraries (downstream packages need dist/)
        run: pnpm --filter @trove/shared --filter @trove/collector-presets build

      # Tauri's externalBin check at build time requires the per-triple
      # binary to exist before clippy/cargo can build the Rust crate.
      # PR 1 added the build chain; we run it here so PR 2's externalBin
      # entry compiles. PR 3's macOS sidecar-mac job covers the same
      # path on darwin.
      - name: Build trove-otelcol sidecar
        run: pnpm build:collector

      - name: Stage sidecar into Tauri binaries dir
        run: pnpm bundle:sidecar

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Vitest with coverage
        run: pnpm test

      - name: Clippy
        run: cargo clippy --manifest-path packages/app/src-tauri/Cargo.toml --all-targets -- -D warnings

      # PR-fast lane: plain `cargo test`. Coverage instrumentation
      # (cargo-llvm-cov + 85%/80% gate) moved to nightly.yml because the
      # instrumented build re-links the entire workspace from scratch
      # — clippy + llvm-cov compiled twice cost ~3-5 min per Linux PR
      # run for a gate that only flips on infrequent coverage regressions.
      # PRs still get full correctness via `cargo test`; nightly catches
      # any coverage backsliding within 24h.
      - name: Cargo test
        run: cargo test --manifest-path packages/app/src-tauri/Cargo.toml --workspace

  e2e:
    name: playwright e2e (ubuntu)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TS workspace libraries
        run: pnpm --filter @trove/shared --filter @trove/collector-presets build

      # Cache the playwright browser download. Keyed on the @playwright/test
      # version that ends up in the lockfile so a version bump invalidates.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          v=$(pnpm --filter @trove/app why -r --depth=0 @playwright/test 2>/dev/null \
                | awk '/@playwright\/test/{print $NF; exit}')
          echo "version=${v:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # Browsers already cached — only install system deps.
            pnpm --filter @trove/app exec playwright install-deps chromium
          else
            pnpm --filter @trove/app exec playwright install --with-deps chromium
          fi

      - name: Run Playwright e2e
        run: pnpm --filter @trove/app e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: packages/app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  sidecar-mac:
    # Sprint 1 acceptance: "Run on macOS in CI". Builds the per-triple
    # collector on darwin-arm64 and runs the cargo integration test
    # against it for platform-specific coverage of the supervisor
    # (signal handling, sidecar path resolution, kill_on_drop). PR-only
    # because it adds ~5–8 min and the Ubuntu lane already covers the
    # logic on Linux x86_64.
    #
    # Cost gate (May 2026): the macOS runner bills at 10x Linux. We now
    # skip this job unless the PR actually touches the sidecar/collector
    # surface — UI / shared / docs PRs cannot meaningfully change what
    # this test exercises. The `changes` job above publishes the bit.
    name: sidecar integration (macos-14)
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.sidecar == 'true'
    needs: changes
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
          shared-key: trove-rust-${{ runner.os }}
          # Only save the cache from main. The post-job save step
          # invokes `cargo metadata --all-features`, which resolves
          # Windows-target crates (e.g. windows_aarch64_gnullvm) and
          # has been failing intermittently on the hosted Linux
          # runner — usually with "No space left on device" — on PRs
          # that change Cargo.lock. Skipping save on PRs keeps the
          # restore behaviour (so PRs still get fast builds) without
          # the flaky save path.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache ocb module cache + installed binary
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: trove-ocb-${{ runner.os }}-${{ hashFiles('resources/otelcol/manifest.yaml') }}
          restore-keys: |
            trove-ocb-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TS workspace libraries
        run: pnpm --filter @trove/shared --filter @trove/collector-presets build

      - name: Build trove-otelcol sidecar
        run: pnpm build:collector

      - name: Stage sidecar into Tauri binaries dir
        run: pnpm bundle:sidecar

      - name: Run collector integration test
        run: cargo test --manifest-path packages/app/src-tauri/Cargo.toml --test collector_integration -- --nocapture

      - name: Upload built collector as artifact (debug aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trove-otelcol-darwin-arm64-${{ github.run_id }}
          path: resources/otelcol/dist/aarch64-apple-darwin/trove-otelcol
          retention-days: 7
          if-no-files-found: ignore

  bundle-linux:
    # WS3 (CI cost optimization): a 1x Linux dry-run of the release *bundling*
    # step. The `ci` job above already compiles the Rust app on Linux (clippy
    # --all-targets + cargo test --workspace), so compile breakage is caught
    # there — but nothing exercises `tauri build`'s bundle generation
    # (.deb/.rpm/.AppImage + externalBin packing + updater artifacts) until a
    # tag, where a failure wastes 10x macOS minutes. This runs that bundle on a
    # cheap Linux runner — unsigned, no release upload — so packaging breakage
    # surfaces on the PR instead. `--debug` reuses the ci job's warm debug cache
    # (the bundler's behaviour is profile-independent), so it's a relink, not a
    # cold release recompile. Gated on the same sidecar/src-tauri paths-filter as
    # sidecar-mac (UI/docs/shared-only PRs can't change what this exercises).
    name: release bundle dry-run (ubuntu)
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.sidecar == 'true'
    needs: changes
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: false
          swap-storage: false

      - uses: actions/checkout@v4

      # Tauri Linux bundle deps; fakeroot/dpkg are required for the .deb bundle
      # (mirrors release.yml's linux leg so the dry-run packages what a tag does).
      - name: Install Linux Tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            fakeroot \
            dpkg

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
          # Same shared-key (no distinct key) as the `ci` job, so this restores
          # that job's main-saved Linux cache — PRs never save (save-if main).
          shared-key: trove-rust-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache ocb module cache + installed binary
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: trove-ocb-${{ runner.os }}-${{ hashFiles('resources/otelcol/manifest.yaml') }}
          restore-keys: |
            trove-ocb-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TS workspace libraries
        run: pnpm --filter @trove/shared --filter @trove/collector-presets build

      - name: Build trove-otelcol sidecar
        run: pnpm build:collector

      - name: Stage sidecar into Tauri binaries dir
        run: pnpm bundle:sidecar

      # Full `tauri build` (unsigned, no release upload): exercises the bundler
      # the tagged release relies on. No APPLE_*/AZURE_*/TAURI_SIGNING_* env, so
      # it builds + bundles without signing or notarizing. --debug to reuse the
      # warm debug cache; bundling behaviour is the same as release.
      - name: Tauri build (bundle dry-run, unsigned)
        run: pnpm --filter @trove/app exec tauri build --debug
