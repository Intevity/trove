name: Release

on:
  push:
    tags:
      - 'v*'

# A re-push of the same tag is rare but happens (e.g., draft release re-cut).
# Deduplicate retries on the same tag, but never cancel a mid-flight macOS
# notarize — that wastes 10x ubuntu-equivalent minutes.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  # id-token is load-bearing for TWO independent things — do not remove it when the S3
  # bridge is eventually retired:
  #   1. build-tauri's Windows leg: azure/login@v2 exchanges the runner's OIDC token for
  #      the Trusted Signing session. build-tauri has no job-level `permissions:` block, so
  #      it inherits this one; dropping it fails the leg with
  #      "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
  #   2. the reusable finalize workflow's bridge-s3 job, which assumes the AWS role via OIDC.
  id-token: write

jobs:
  build-tauri:
    name: Build Tauri app (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # Run in the `release` GitHub Environment so the Windows leg's Azure OIDC token carries
    # the subject `repo:<owner>/<repo>:environment:release` — the federated credential behind
    # AZURE_CLIENT_ID is scoped to exactly that. Harmless for the macOS/Linux legs: the
    # environment has no protection rules and repo-level secrets/variables stay accessible.
    # (Create it once with: gh api -X PUT repos/<owner>/<repo>/environments/release)
    environment: release
    # macOS notarization is NOT awaited here: this leg signs the bundle and
    # submits to Apple's notary WITHOUT waiting (see the "Submit to notary"
    # step), then exits. The queue wait is paid on the 1x ubuntu
    # `notarize-wait` job and stapling happens on the short macOS job in
    # notarize-finalize.yml, so the 10x build leg never blocks on Apple.
    # 45 min: a cold-cache `tauri build` on the slowest leg occasionally
    # ran past the old 30 min cap, cancelling that leg and cascading to
    # skip notarize-wait + finalize (v0.7.3 windows cache-save, v0.8.0
    # linux build). The extra headroom lets the slow leg finish AND lets
    # the rust-cache save complete, which warms the cache so subsequent
    # release builds drop well under the cap.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE macOS leg builds a UNIVERSAL (arm64 + x86_64) bundle on arm64
          # `macos-latest` (GitHub retired the Intel macos-13 image in Dec 2025).
          # `--target universal-apple-darwin` makes `tauri build` compile both
          # arches and lipo them into a single .dmg / .app.tar.gz that runs
          # natively on Apple Silicon AND Intel — one 10x job and one notary
          # submission instead of two, while still shipping Intel support. The Go
          # sidecar is likewise built for both arches and lipo'd to match (see the
          # universal-apple-darwin case in build-collector.sh). `rust_target` is the
          # tauri --target / sidecar-name / sign target; the two REAL rustup std
          # targets it needs are installed in the toolchain step below.
          - os: macos-latest
            platform: macos-universal
            rust_target: universal-apple-darwin
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            platform: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            args: ''
          - os: windows-2022
            platform: windows-x64
            rust_target: x86_64-pc-windows-msvc
            args: ''

    steps:
      # Free ~25–30 GB on the Ubuntu runner. Same rationale as ci.yml:
      # the Tauri build chain plus tauri-action's bundle step pushes
      # close to the 14 GB default. macOS / Windows runners have more
      # headroom and don't need the cleanup.
      - name: Free disk space on runner
        if: matrix.os == 'ubuntu-22.04'
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: false
          swap-storage: false

      - uses: actions/checkout@v4

      # Stamp the tag's version into tauri.conf.json + Cargo.toml so the
      # bundle's `productVersion` (and therefore the artifact filenames
      # like `Trove_0.6.0_aarch64.dmg`) match the tag instead of whatever
      # stale version the repo carries. Runs in every matrix leg so each
      # platform builds against the same patched manifest. The workflow
      # trigger filter already guarantees `GITHUB_REF_NAME` starts with
      # `v`, so the prefix strip is safe; the `set -e` guard makes a
      # malformed value fail the leg loudly rather than silently shipping
      # a misnamed bundle.
      - name: Sync version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not in the expected 'vX.Y.Z' form" >&2
            exit 1
          fi
          echo "Stamping version=$VERSION into tauri.conf.json + Cargo.toml"

          # tauri.conf.json — bundle metadata + artifact name source. The updater
          # endpoint is committed (GitHub releases/latest/download/latest.json) and
          # needs no per-build stamping: the publish-manifest job attaches the
          # matching manifest to every release.
          node -e "
            const fs = require('fs');
            const p = 'packages/app/src-tauri/tauri.conf.json';
            const json = JSON.parse(fs.readFileSync(p, 'utf8'));
            json.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(json, null, 2) + '\n');
          " "$VERSION"

          # Cargo.toml — only the [package] section's version, not any
          # dependency that happens to have its own `version = "..."`.
          # `sed -i.bak` is the portable form (both GNU and BSD sed).
          sed -i.bak -E '/^\[package\]/,/^\[/ s/^version = ".*"/version = "'"$VERSION"'"/' \
            packages/app/src-tauri/Cargo.toml
          rm -f packages/app/src-tauri/Cargo.toml.bak

          echo "--- tauri.conf.json ---"
          grep '"version"' packages/app/src-tauri/tauri.conf.json | head -1
          echo "--- Cargo.toml ---"
          # awk is portable across GNU + BSD runners; brace-form sed ranges
          # are GNU-only and fail on the macOS (BSD sed) legs.
          awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version = /{print; exit}' \
            packages/app/src-tauri/Cargo.toml

      # Linux Tauri build deps + dpkg/fakeroot for the .deb bundle.
      # `fakeroot` is preinstalled on ubuntu-22.04, but we install it
      # explicitly so a future image change doesn't break the .deb step.
      - name: Install Linux Tauri build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            fakeroot \
            dpkg

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin is a tauri pseudo-triple, NOT a rustup target,
          # so the universal macOS leg installs BOTH real apple std targets that
          # `tauri build --target universal-apple-darwin` compiles + lipos. Every
          # other leg installs its single matrix triple.
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
          # Per-platform key so each matrix leg keeps its own target/ cache
          # (legs share runner.os but build different target triples).
          key: ${{ matrix.platform }}
          shared-key: trove-rust-${{ runner.os }}-release
          # Save only on tag pushes; release builds run rarely so
          # cache hits are mostly opportunistic.
          save-if: ${{ startsWith(github.ref, 'refs/tags/v') }}

      # Go 1.25+ is required by ocb (the OpenTelemetry Collector
      # Builder) used by `pnpm build:collector`.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache ocb module cache + installed binary
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: trove-ocb-${{ runner.os }}-${{ hashFiles('resources/otelcol/manifest.yaml') }}
          restore-keys: |
            trove-ocb-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TS workspace libraries
        run: pnpm --filter @trove/shared --filter @trove/collector-presets build

      # build-collector.sh respects TROVE_TARGET_TRIPLE for cross-target
      # builds. bundle-sidecar.ts then stages the resulting binary into
      # packages/app/src-tauri/binaries/ with the platform-triple suffix
      # Tauri's externalBin entry expects.
      - name: Build trove-otelcol sidecar (${{ matrix.rust_target }})
        env:
          TROVE_TARGET_TRIPLE: ${{ matrix.rust_target }}
        run: pnpm build:collector

      - name: Stage sidecar into Tauri binaries dir
        env:
          TROVE_TARGET_TRIPLE: ${{ matrix.rust_target }}
        run: pnpm bundle:sidecar

      # Windows code signing is OIDC end to end — no stored client secret. azure/login
      # exchanges the runner's OIDC token (subject scoped to the `release` environment
      # above) for an Azure session; Microsoft's `sign` tool then signs via
      # DefaultAzureCredential off that session. Skipped (leg builds unsigned, like a fork)
      # whenever any of the six AZURE_* repo variables is unset.
      - name: Azure login (OIDC) for code signing
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_TS_ENDPOINT != '' && vars.AZURE_TS_ACCOUNT != '' && vars.AZURE_TS_PROFILE != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      # Install Microsoft's `sign` tool, detect the trusted-/artifact-signing subcommand
      # (Microsoft is mid-rename), and inject bundle.windows.signCommand into tauri.conf.json
      # IN CI ONLY (the committed config stays clean for local unsigned builds). The exported
      # SIGN_TOOL_PATH / SIGN_SUBCOMMAND / AZURE_TS_* are reused by the sidecar signing step.
      - name: Prepare Windows signing (Trusted/Artifact Signing)
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_TS_ENDPOINT != '' && vars.AZURE_TS_ACCOUNT != '' && vars.AZURE_TS_PROFILE != ''
        shell: bash
        env:
          AZURE_TS_ENDPOINT: ${{ vars.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ vars.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ vars.AZURE_TS_PROFILE }}
        run: |
          set -euo pipefail
          dotnet tool install --global --prerelease sign
          if [[ ! -f "$HOME/.dotnet/tools/sign.exe" ]]; then
            echo "::error::sign tool not found at $HOME/.dotnet/tools/sign.exe after install" >&2
            exit 1
          fi
          # Absolute path with forward slashes — Tauri runs signCommand as a raw process.
          SIGN_EXE="$(cygpath -m "$HOME/.dotnet/tools/sign.exe")"
          echo "sign tool: $SIGN_EXE"
          # The trusted->artifact rename is mid-flight; detect which subcommand this build ships.
          help="$("$SIGN_EXE" code --help 2>&1 || true)"
          if printf '%s' "$help" | grep -q 'artifact-signing'; then
            sub='artifact-signing'
          else
            sub='trusted-signing'
          fi
          echo "sign subcommand: $sub"
          # Inject bundle.windows.signCommand — CI only; the committed tauri.conf.json stays clean.
          SIGN_EXE="$SIGN_EXE" SUB="$sub" node -e '
            const fs = require("fs");
            const p = "packages/app/src-tauri/tauri.conf.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const sub = process.env.SUB;
            j.bundle.windows = j.bundle.windows || {};
            j.bundle.windows.signCommand = {
              cmd: process.env.SIGN_EXE,
              args: [
                "code", sub,
                "--" + sub + "-endpoint", process.env.AZURE_TS_ENDPOINT,
                "--" + sub + "-account", process.env.AZURE_TS_ACCOUNT,
                "--" + sub + "-certificate-profile", process.env.AZURE_TS_PROFILE,
                "-d", "Trove",
                "%1",
              ],
            };
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log("Patched signCommand:", JSON.stringify(j.bundle.windows.signCommand));
          '
          # Export for the sidecar signing step (the sidecar is signed before tauri build).
          {
            echo "AZURE_TS_ENDPOINT=$AZURE_TS_ENDPOINT"
            echo "AZURE_TS_ACCOUNT=$AZURE_TS_ACCOUNT"
            echo "AZURE_TS_PROFILE=$AZURE_TS_PROFILE"
            echo "SIGN_TOOL_PATH=$SIGN_EXE"
            echo "SIGN_SUBCOMMAND=$sub"
          } >> "$GITHUB_ENV"

      # Prepare macOS signing: validate secrets, import the Developer ID cert into a
      # dedicated, unlocked, search-listed keychain, and stage the notarization key.
      # The cert must be resident BEFORE the build because the sidecar is codesigned
      # in the next step (Tauri does not sign externalBin — tauri-apps/tauri#11992),
      # which runs before the Tauri CLI would import a cert itself. We import exactly
      # once and the Build step omits APPLE_CERTIFICATE, so there is a single identity
      # (a second import makes `codesign --sign <name>` ambiguous); Tauri signs via
      # APPLE_SIGNING_IDENTITY against this keychain. macOS-only.
      - name: Prepare Apple signing + notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          # Fail fast with one clear message if any required Apple secret is missing —
          # signing is mandatory (a macOS auto-update can only install a notarized
          # bundle), so a half-configured or unsigned release should never ship.
          missing=()
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            [[ -z "${!v:-}" ]] && missing+=("$v")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing Apple secret(s): ${missing[*]}. Set all six (see documentation/releasing.md) before tagging a macOS release." >&2
            exit 1
          fi

          # Import the Developer ID cert into a dedicated keychain. set-key-partition-list
          # lets codesign use the key non-interactively; list-keychains -s puts our
          # keychain on the search path so `codesign --sign "<identity>"` resolves by name.
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN_PATH" -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          # Fail loudly here (cheap) rather than deep in the build if the import didn't take.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in the keychain after import." >&2; exit 1; }

          # notarytool needs the App Store Connect key as a file on disk; the secret
          # holds its base64. Written under RUNNER_TEMP, never the workspace.
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      # Tauri's bundler does NOT sign externalBin sidecars
      # (tauri-apps/tauri#11992), so an unsigned trove-otelcol Mach-O would
      # ride inside the .app and Apple's notary would reject the submission.
      # Sign bottom-up: sidecar first (hardened runtime + timestamp are
      # notarization requirements; the Go collector needs no JIT or
      # library-validation entitlements), then let `tauri build` sign the
      # enclosing .app, sealing this signature into CodeResources.
      - name: Sign sidecar binary (bottom-up, before tauri build)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          bin="packages/app/src-tauri/binaries/trove-otelcol-${{ matrix.rust_target }}"
          [[ -f "$bin" ]] || { echo "::error::Staged sidecar not found at $bin" >&2; exit 1; }
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

      # Tauri does NOT sign externalBin (tauri-apps/tauri#11992), so the Go collector .exe
      # must be Authenticode-signed BEFORE tauri build packs it into the NSIS/MSI installers —
      # otherwise it ships unsigned inside an otherwise-signed installer. Uses the sign tool +
      # OIDC session prepared above. Windows mirror of the macOS sidecar signing step.
      - name: Sign sidecar binary (Windows Authenticode, before tauri build)
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_TS_ENDPOINT != '' && vars.AZURE_TS_ACCOUNT != '' && vars.AZURE_TS_PROFILE != ''
        shell: bash
        run: |
          set -euo pipefail
          bin="packages/app/src-tauri/binaries/trove-otelcol-${{ matrix.rust_target }}.exe"
          [[ -f "$bin" ]] || { echo "::error::Staged sidecar not found at $bin" >&2; exit 1; }
          # SIGN_TOOL_PATH / SIGN_SUBCOMMAND / AZURE_TS_* were exported to $GITHUB_ENV by the
          # "Prepare Windows signing" step. Argv array (no shell) — the spaced -d value and the
          # path need no quoting. Fail loudly: a silent miss only surfaces as a SmartScreen/AV
          # warning on a shipped installer, long after this expensive release build.
          "$SIGN_TOOL_PATH" code "$SIGN_SUBCOMMAND" \
            "--${SIGN_SUBCOMMAND}-endpoint" "$AZURE_TS_ENDPOINT" \
            "--${SIGN_SUBCOMMAND}-account" "$AZURE_TS_ACCOUNT" \
            "--${SIGN_SUBCOMMAND}-certificate-profile" "$AZURE_TS_PROFILE" \
            -d "Trove" "$bin"

      # Signing mechanisms here:
      #   1. The Developer ID identity imported above signs the .app and the
      #      already-signed sidecar (Gatekeeper). Tauri signs via APPLE_SIGNING_IDENTITY
      #      against that keychain; APPLE_CERTIFICATE is intentionally NOT passed.
      #   2. APPLE_API_* are intentionally WITHHELD from this step so tauri-action signs
      #      but does NOT notarize/staple — its notarize is a blocking `notarytool --wait`
      #      on this 10x runner. We submit no-wait in the next step and finalize on cheaper
      #      jobs (see notarize-wait below / notarize-finalize.yml).
      #   3. TAURI_SIGNING_PRIVATE_KEY → signs the auto-updater artifacts
      #      (.app.tar.gz.sig / latest.json), NOT the .app bundle.
      #   4. Windows Authenticode → the "Prepare Windows signing" step injected a
      #      bundle.windows.signCommand (Azure Trusted Signing via Microsoft's `sign` tool
      #      over the OIDC session, no stored secret); tauri build invokes it to sign the
      #      app .exe / NSIS -setup.exe / MSI. The leg builds unsigned when AZURE_* is unset.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: packages/app
          tagName: ${{ github.ref_name }}
          releaseName: Trove ${{ github.ref_name }}
          releaseBody: |
            See the GitHub release notes for changes since the previous tag.

            macOS bundles are Developer ID-signed and notarized; the in-app
            updater is fed from this release's own `latest.json` asset. Windows
            bundles are Authenticode-signed via Azure Trusted Signing when the
            AZURE_* repo variables are configured.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Fail the release if any Windows artifact slipped through unsigned (e.g. a signCommand
      # that silently no-op'd) — a miss otherwise only surfaces as a SmartScreen/AV warning on
      # an already-published installer. Native Get-AuthenticodeSignature, no extra tooling.
      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_TS_ENDPOINT != '' && vars.AZURE_TS_ACCOUNT != '' && vars.AZURE_TS_PROFILE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "packages/app/src-tauri/target/release/bundle"
          $targets = @()
          $targets += Get-ChildItem -Path "$bundle/nsis" -Filter '*-setup.exe' -ErrorAction SilentlyContinue
          $targets += Get-ChildItem -Path "$bundle/msi"  -Filter '*.msi'        -ErrorAction SilentlyContinue
          $targets += Get-ChildItem -Path "packages/app/src-tauri/binaries" -Filter 'trove-otelcol-*.exe' -ErrorAction SilentlyContinue
          if ($targets.Count -eq 0) {
            Write-Error "No Windows artifacts (nsis *-setup.exe, msi *.msi, sidecar .exe) found to verify."
          }
          $unsigned = @()
          foreach ($f in $targets) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            Write-Host ("{0,-12} {1}" -f $sig.Status, $f.Name)
            if ($sig.Status -eq 'NotSigned') {
              $unsigned += $f.Name
            } elseif ($sig.Status -ne 'Valid') {
              Write-Warning ("{0}: Authenticode status '{1}' - {2}" -f $f.Name, $sig.Status, $sig.StatusMessage)
            }
          }
          if ($unsigned.Count -gt 0) {
            Write-Error ("Unsigned Windows artifact(s): {0}. Expected Azure Trusted Signing Authenticode signatures." -f ($unsigned -join ', '))
          }
          Write-Host "Windows Authenticode verification passed (no unsigned artifacts)."

      # Submit the signed .dmg to Apple's notary service WITHOUT waiting, then hand the
      # submission id to the notarize-wait job. tauri-action above signed the bundle but
      # (with APPLE_API_* withheld) did not notarize, so this 10x runner never blocks on
      # Apple's queue. Submitting the .dmg also notarizes the nested app's code identity,
      # which is what lets notarize-finalize staple both the dmg and the updater app.
      - name: Submit to notary (no wait)
        if: runner.os == 'macOS'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          # One universal macOS leg -> one .dmg -> one submission -> one
          # notary-universal.json marker. notary-poll.mjs / notarize-poll.yml glob
          # notary-*.json, so they pick it up unchanged.
          ARCH: universal
        run: |
          set -euo pipefail
          dmg="$(find packages/app/src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "::error::No .dmg found to notarize under target/.../release/bundle/dmg/" >&2
            exit 1
          fi
          echo "Submitting $dmg to notary (no wait)…"
          id="$(xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --no-wait --output-format json \
            | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).id || ""')"
          if [[ -z "$id" ]]; then
            echo "::error::notarytool submit did not return a submission id" >&2
            exit 1
          fi
          echo "Notary submission id ($ARCH): $id"
          mkdir -p notary-out
          printf '{"arch":"%s","submissionId":"%s","dmg":"%s"}\n' \
            "$ARCH" "$id" "$(basename "$dmg")" > "notary-out/notary-$ARCH.json"

      - name: Attach notary submission id to the draft release
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Durable pending-notarization marker. Read by notarize-wait (this run) and, if
          # Apple is slow, by the scheduled notarize-poll workflow (a later run) — hence a
          # release asset, not a run-scoped workflow artifact. The per-arch filename keeps
          # the two macOS legs from clobbering each other.
          gh release upload "$GITHUB_REF_NAME" notary-out/notary-*.json --clobber --repo "$GITHUB_REPOSITORY"

  # Short inline wait on Apple's notary queue (1x ubuntu) to catch the common
  # fast-notarization case so a typical release finalizes within its own run. If Apple is
  # slow this DEFERS (the poller exits 2, not a failure): the draft release keeps its
  # notary-*.json markers and the scheduled notarize-poll workflow finalizes it whenever
  # Apple completes — no held runner, no rebuild. A hard notarization failure (Invalid)
  # still fails loudly here.
  notarize-wait:
    name: Wait for Apple notarization (short)
    needs: [build-tauri]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Explicit block (replaces the inherited top-level set): contents:write because draft
    # `gh release download` needs push-level access, and actions:write so the deferred
    # branch can `gh workflow enable` the scheduled notarize-poll workflow.
    permissions:
      contents: write
      actions: write
    outputs:
      state: ${{ steps.poll.outputs.state }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      # ~20 min inline; longer waits hand off to notarize-poll.yml rather than hold a runner.
      NOTARY_POLL_TIMEOUT_MS: '1200000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download notary submission ids from the draft release
        run: |
          set -euo pipefail
          mkdir -p notary-ids
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir notary-ids --pattern 'notary-*.json'
          ls -1 notary-ids
      - name: Poll notary (short), else defer to the scheduled poller
        id: poll
        run: |
          set +e
          node scripts/notary-poll.mjs notary-ids
          code=$?
          set -e
          case "$code" in
            0) echo "state=accepted" >> "$GITHUB_OUTPUT"
               echo "Accepted within the inline window." ;;
            2) echo "state=deferred" >> "$GITHUB_OUTPUT"
               # The scheduled poll disables itself while idle, so wake it for this draft.
               # It rechecks Apple each tick and finalizes once Accepted, then goes dormant again.
               echo "::notice::Notarization still pending; enabling the scheduled notarize-poll workflow to finalize this release when Apple completes."
               gh workflow enable notarize-poll.yml --repo "$GITHUB_REPOSITORY" || true ;;
            *) echo "state=failed" >> "$GITHUB_OUTPUT"
               echo "::error::Notarization failed (Invalid/Rejected or fatal error)."
               exit 1 ;;
          esac

  # Fast path: Apple accepted within the inline window, so staple + publish now. The same
  # reusable workflow is invoked by notarize-poll.yml for the slow path. Skipped when
  # notarize-wait deferred (the scheduled poller takes over) or failed.
  finalize:
    name: Finalize (staple + publish)
    needs: [notarize-wait]
    if: needs.notarize-wait.outputs.state == 'accepted'
    uses: ./.github/workflows/notarize-finalize.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
