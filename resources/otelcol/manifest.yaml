# OpenTelemetry Collector Builder (ocb) manifest for trove-otelcol.
#
# This manifest produces a slim Collector binary containing only the
# components Trove ships with. The binary lands in
# resources/otelcol/_build/<triple>/trove-otelcol[.exe] and is then staged
# into packages/app/src-tauri/binaries/ by scripts/bundle-sidecar.ts.
#
# Sprint 1 ships the full MVP component set so later sprints (5, 8) can
# add backend presets without touching this manifest. Bumping the pinned
# version is a coordinated edit: change every "v0.151.0" below at once.

dist:
  module: github.com/intevity/trove-otelcol
  name: trove-otelcol
  description: Trove — vendor-neutral OTLP gateway for AI coding harnesses.
  version: 0.1.0
  output_path: ./_build
  otelcol_version: 0.151.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.151.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.151.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.151.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.151.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.151.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.151.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/datadogexporter v0.151.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.151.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.151.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.151.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.151.0
  # Sprint 13 — Tier A mapping overlay. `transform` provides OTTL for
  # back-filling `harness.id` from `service.name` on native-OTel
  # harness emissions; `metricstransform` produces the additive Tier A
  # copy (action: insert) of each declared native metric.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.151.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/metricstransformprocessor v0.151.0
