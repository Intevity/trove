pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,jsx,ts,tsx,json,md,yml,yaml,css}'
      run: pnpm prettier --check {staged_files}
    eslint:
      glob: '*.{js,jsx,ts,tsx}'
      run: pnpm eslint {staged_files}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
